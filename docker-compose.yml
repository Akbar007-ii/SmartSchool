services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env файлында көрсөтүлүшү керек}
      POSTGRES_DB: ${DB_NAME:-school}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-school}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # База сыртка ачылбайт — API гана ички тармак аркылуу кирет

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      MEDIA_ROOT: /app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-80}:8000"
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  media:
